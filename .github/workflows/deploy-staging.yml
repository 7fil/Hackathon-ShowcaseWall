name: Deploy Staging Backend to VM

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image and export to tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: bcc-showcase-app:staging
          outputs: type=docker,dest=bcc-showcase-app.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy image tar to VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          source: "bcc-showcase-app.tar,docker-compose.yml"
          target: "/opt/bcc-showcase"

      - name: Load image and restart container on VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            set -e
            cd /opt/bcc-showcase
            docker load -i bcc-showcase-app.tar
            rm -f bcc-showcase-app.tar
            docker compose up -d --no-build
            docker image prune -f